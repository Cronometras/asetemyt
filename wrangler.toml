name = "asetemyt"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]

# Astro local utiliza la misma D1 remota que producción. Requiere wrangler login.
# Las escrituras desde localhost también modifican los datos de producción.
# El binding de Pages debe apuntar a esta misma base en Cloudflare Dashboard.

[[d1_databases]]
binding = "DB"
database_name = "asetemyt-directorio"
database_id = "9047e833-5b98-4859-b234-774905843e78"
remote = true
migrations_dir = "migrations"
